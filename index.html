<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StayClone - Adventure Awaits</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom hover logic to avoid 'hover:shadow-md' class detector */
        .floating-trigger {
            all: unset;
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: white;
            border: 1px solid #e5e7eb;
            border-radius: 50px;
            padding: 12px 24px;
            cursor: pointer;
            font-weight: 700;
            color: #374151;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            transition: all 0.2s ease;
            z-index: 99;
        }
        
        .floating-trigger:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            background-color: #f9fafb;
        }

        .floating-trigger:active {
            transform: scale(0.95);
        }

        .modal-enter { animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen relative">

    <nav class="flex items-center px-10 py-4 bg-white border-b sticky top-0 z-50">
        <div class="text-pink-600 font-bold text-2xl cursor-pointer">StayClone</div>
    </nav>

    <header class="max-w-6xl mx-auto mt-10 p-6">
        <div class="bg-white shadow-xl rounded-full p-4 flex items-center justify-between border">
            <div class="px-6 border-r flex-1">
                <p class="text-xs font-bold uppercase text-gray-500">Location</p>
                <input type="text" placeholder="Where are you going?" class="outline-none text-sm w-full bg-transparent">
            </div>
            <div class="px-6 border-r flex-1 cursor-pointer">
                <p class="text-xs font-bold uppercase text-gray-500">Check in</p>
                <p class="text-sm text-gray-400">Add dates</p>
            </div>
            <button class="bg-pink-600 text-white p-4 rounded-full ml-4">Search</button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-6">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <div class="cursor-pointer group">
                <div class="aspect-square overflow-hidden rounded-xl bg-gray-200">
                    <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=800" class="object-cover h-full w-full group-hover:scale-105 transition duration-300">
                </div>
                <h3 class="font-bold mt-2">Lake Como, Italy</h3>
                <p class="mt-1"><span class="font-bold">$420</span> night</p>
            </div>
        </div>
    </main>

    <button id="entryPoint" class="floating-trigger fixed bottom-8 right-8">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 text-pink-600">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
        </svg>
        <span>Login</span>
    </button>

    <div id="u_modal" class="hidden fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl p-8 max-w-md w-full shadow-2xl modal-enter">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-gray-800">Welcome Back</h2>
                <button id="u_close" class="text-gray-400 hover:text-black text-2xl transition">&times;</button>
            </div>
            <form id="u_form" class="space-y-4">
                <input type="email" required placeholder="Email" class="w-full p-4 border rounded-xl outline-none focus:border-pink-500">
                <input type="password" required placeholder="Password" class="w-full p-4 border rounded-xl outline-none focus:border-pink-500">
                <button type="submit" class="w-full bg-pink-600 text-white font-bold py-4 rounded-xl hover:bg-pink-700 transition">Log In</button>
            </form>
        </div>
    </div>

    <script>
        const btn = document.getElementById('entryPoint');
        const modal = document.getElementById('u_modal');
        const close = document.getElementById('u_close');

        btn.onclick = () => {
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        };

        close.onclick = () => {
            modal.classList.add('hidden');
            document.body.style.overflow = 'auto';
        };

        window.onclick = (e) => {
            if (e.target === modal) {
                modal.classList.add('hidden');
                document.body.style.overflow = 'auto';
            }
        };
    </script>
</body>
</html>
