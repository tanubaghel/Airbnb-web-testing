<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StayClone - Find your next adventure</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .modal-enter {
            animation: fadeIn 0.2s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="bg-gray-50">

    <nav class="flex items-center justify-between px-10 py-4 bg-white border-b sticky top-0 z-50">
        <div class="text-pink-600 font-bold text-2xl cursor-pointer">
            StayClone
        </div>
        
        <div id="loginBtn" class="flex items-center gap-2 border rounded-full py-2.5 px-8 shadow-sm hover:shadow-md transition cursor-pointer active:scale-95 bg-white border-gray-300">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 text-gray-600">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
            </svg>
            <span class="font-bold text-gray-700">Login</span>
        </div>
    </nav>

    <header class="max-w-6xl mx-auto mt-10 p-6">
        <div class="bg-white shadow-xl rounded-full p-4 flex items-center justify-between border">
            <div class="px-6 border-r flex-1">
                <p class="text-xs font-bold uppercase text-gray-500">Location</p>
                <input type="text" placeholder="Where are you going?" class="outline-none text-sm w-full bg-transparent">
            </div>
            <div class="px-6 border-r flex-1 cursor-pointer group">
                <p class="text-xs font-bold uppercase text-gray-500">Check in</p>
                <p class="text-sm text-gray-400">Add dates</p>
            </div>
            <div class="px-6 flex-1 cursor-pointer">
                <p class="text-xs font-bold uppercase text-gray-500">Who</p>
                <p class="text-sm text-gray-400">Add guests</p>
            </div>
            <button class="bg-pink-600 hover:bg-pink-700 text-white p-4 rounded-full transition active:scale-90">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
        <div class="cursor-pointer group">
            <div class="aspect-square overflow-hidden rounded-xl bg-gray-200">
                <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=800" class="object-cover h-full w-full group-hover:scale-105 transition duration-300">
            </div>
            <h3 class="font-bold mt-2 text-gray-800">Lake Como, Italy</h3>
            <p class="text-gray-500">4,500 miles away</p>
            <p class="text-gray-500 underline">Oct 12-17</p>
            <p class="mt-1"><span class="font-bold text-gray-900">$420</span> night</p>
        </div>
    </main>

    <div id="loginModal" class="hidden fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl p-8 max-w-md w-full shadow-2xl modal-enter">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold">Log in</h2>
                <button id="closeModal" class="text-gray-500 hover:bg-gray-100 rounded-full h-8 w-8 flex items-center justify-center transition">&times;</button>
            </div>
            
            <form id="loginForm" class="space-y-4">
                <div class="border rounded-lg overflow-hidden border-gray-300">
                    <input type="email" required placeholder="Email" class="w-full p-4 border-b focus:bg-gray-50 outline-none text-sm border-gray-300">
                    <input type="password" required placeholder="Password" class="w-full p-4 focus:bg-gray-50 outline-none text-sm">
                </div>
                <button type="submit" class="w-full bg-pink-600 text-white font-bold py-3 rounded-lg hover:bg-pink-700 transition active:scale-[0.98]">
                    Continue
                </button>
            </form>
        </div>
    </div>

    <script>
        const loginBtn = document.getElementById('loginBtn');
        const loginModal = document.getElementById('loginModal');
        const closeModal = document.getElementById('closeModal');
        const loginForm = document.getElementById('loginForm');

        loginBtn.addEventListener('click', () => {
            loginModal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        });

        closeModal.addEventListener('click', () => {
            loginModal.classList.add('hidden');
            document.body.style.overflow = 'auto';
        });

        window.addEventListener('click', (e) => {
            if (e.target === loginModal) {
                loginModal.classList.add('hidden');
                document.body.style.overflow = 'auto';
            }
        });

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Success!');
            loginModal.classList.add('hidden');
            document.body.style.overflow = 'auto';
        });
    </script>
</body>
</html>
